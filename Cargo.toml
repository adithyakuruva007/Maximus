[workspace]
resolver = "2"
members = [
    "crates/max-core",
    "crates/max-state",
    "crates/max-memory",
    "crates/max-providers",
    "crates/max-tools",
    "crates/max-sandbox",
    "crates/max-runtime",
    "crates/max-channels",
    "crates/max-tui",
    "crates/max-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Adithya Kuruva <adithyakuruva.id@gmail.com>"]
license = "MIT"
repository = "https://github.com/adithyakuruva007/Maximus"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.26"
crossterm = "0.27"
tempfile = "3.10"
dirs = "5.0"
