name: Build Rust Release Binary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: maximus
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: maximus
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: maximus.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Run Tests
        run: cargo test --target ${{ matrix.target }}
        shell: bash

      - name: Package binary artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/maximus-${{ matrix.target }}.zip" "$BIN_PATH"
          else
            tar -czvf "dist/maximus-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          fi

      - name: Upload compiled binary as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maximus-${{ matrix.target }}
          path: dist/*
          retention-days: 14
